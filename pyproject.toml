[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Health-insurance claim pre-check platform: extract, validate, score, explain, human review."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "joblib>=1.6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pyjwt[crypto]>=2.8"]
azure = [
  "azure-identity>=1.17",
  "azure-storage-blob>=12.20",
  "azure-cosmos>=4.7",
  "azure-servicebus>=7.12",
  "azure-ai-documentintelligence>=1.0.0",
  "azure-search-documents>=11.6",
  "openai>=1.40",
  "azure-monitor-opentelemetry>=1.6",
]
pdf = ["pypdf>=4.0"]
mlops = ["mlflow-skinny>=2.14", "shap>=0.45"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pip-audit", "locust>=2.29"]

[project.scripts]
claimlens = "claimlens.cli:main"

[tool.setuptools.packages.find]
where = ["src", "apps/api"]

[tool.setuptools.package-data]
"claimlens.rules" = ["policies/*.yaml"]
"claimlens.ml" = ["reference/*.json"]
"claimlens.rag" = ["wording/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["azure: needs real Azure resources (skipped by default)", "slow: trains models"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012", "E501"]  # formatter owns line length; long strings and comments are allowed

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF001"]
"apps/api/**" = ["B008"]  # FastAPI dependency injection uses Depends() in defaults
"src/claimlens/synthetic/**" = ["S311"]  # seeded PRNG for reproducible synthetic data, not security
"src/claimlens/evaluation.py" = ["S311"]
"src/claimlens/domain/models.py" = ["S105"]  # RuleStatus.PASS = "pass" is not a password
"src/claimlens/extraction/local_extractor.py" = ["RUF001"]  # en dash and multiplication sign are matched on purpose
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["src", "apps/api"]
