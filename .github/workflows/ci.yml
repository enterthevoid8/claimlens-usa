name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[api,azure,pdf,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=claimlens --cov=claimlens_api --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: findings are reviewed, not allowed to block unrelated work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[api,azure,pdf]" pip-audit
      - run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
      - run: bicep build infra/main.bicep --stdout > /dev/null
      - run: bicep lint infra/main.bicep
      - run: |
          for f in infra/parameters/*.bicepparam; do bicep build-params "$f" --stdout > /dev/null; done

  model-gate:
    # Retrains on synthetic data and enforces the release gate (AUC, calibration, beats rules, subgroup parity).
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: claimlens train --n 4000
      - run: claimlens eval --n 500
      - uses: actions/upload-artifact@v4
        with: { name: model-and-eval-report, path: "models/risk\nreports" }
